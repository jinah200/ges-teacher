<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생각하는 교사의 AI 수업 · GES Gemini 워크숍</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@500;600;700;900&display=swap">
<style>
  :root{--blue:#2f6b4a;--blue-d:#20503a;--blue-l:#e5efe7;--navy:#2b2622;--gray:#6d645a;--line:#e7ddcf;--bg:#fbf7ef;--red:#b0303a;--serif:"Noto Serif KR","Nanum Myeongjo",serif;}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;
    font-family:"Pretendard Variable","Pretendard","Noto Sans KR",-apple-system,system-ui,sans-serif;color:var(--navy);background:var(--bg);}
  .topbar{flex:none;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 18px;border-top:4px solid transparent;border-image:repeating-linear-gradient(90deg,#b0303a 0 22px,#2f6b4a 22px 44px,#c99a2e 44px 50px) 4;
    background:rgba(250,247,241,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .brand{display:flex;flex-direction:column;line-height:1.2;white-space:nowrap;}
  .brand .bt{font-family:var(--serif);font-weight:700;font-size:1.08rem;color:var(--navy);}
  .brand .bsub{font-size:.72rem;font-weight:600;color:var(--gray);letter-spacing:.02em;}
  @media(max-width:900px){.brand .bsub{display:none;}}
  /* 학교급 토글 */
  .levels{display:flex;gap:3px;background:#efe8db;border-radius:999px;padding:3px;}
  .levels button{border:0;background:transparent;font-family:inherit;font-weight:700;font-size:.85rem;
    padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--gray);transition:.14s;}
  .levels button.on{background:var(--bg);color:var(--blue-d);box-shadow:0 1px 3px rgba(60,50,40,.18);}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab{border:1px solid transparent;background:#fffdf8;color:#4a4238;font-family:inherit;font-weight:600;
    font-size:.82rem;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.14s;}
  .tab .s{display:block;font-size:.68rem;font-weight:600;color:var(--gray);}
  .tab:hover{border-color:var(--blue);color:var(--blue-d);}
  .tab.active{background:var(--blue);color:#fff;}
  .tab.active .s{color:#e8eef1;}
  .acts{margin-left:auto;display:flex;gap:8px;align-items:center;}
  .tabs{order:5;flex-basis:100%;justify-content:flex-start;padding-top:2px;}
  .sv-top{background:var(--red,#b0533b);color:#fff;text-decoration:none;font-weight:800;font-size:.84rem;padding:7px 14px;border-radius:999px;white-space:nowrap;}
  .sv-top:hover{opacity:.9;}
  .ges-top{background:var(--blue);color:#fff;text-decoration:none;font-weight:700;
    font-size:.82rem;padding:7px 14px;border-radius:999px;white-space:nowrap;transition:.14s;}
  .ges-top:hover{background:var(--blue-d);}
  .wow-top{background:#fffdf8;color:#7c5d80;border:1.5px solid #7c5d80;text-decoration:none;font-weight:700;font-size:.84rem;padding:6px 12px;border-radius:999px;white-space:nowrap;}
  .wow-top:hover{background:#f3ecf4;}
  .stage{flex:1;position:relative;background:var(--bg);}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  @media(max-width:720px){.tab .s{display:none;}.brand{font-size:.9rem;}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="bt">🎄 생각하는 교사의 AI 수업</span><span class="bsub">GES · Gemini &amp; Gemini Notebook</span></div>
  <div class="levels" id="levels" title="학교급 선택">
    <button data-lv="elem" class="on">초등</button>
    <button data-lv="mid">중등</button>
    <button data-lv="high">고등</button>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-src="home.html">🏠 홈</button>
    <button class="tab" data-src="intro.html">1 · 여는 성찰<span class="s">나는 무엇을 원하는가</span></button>
    <button class="tab" data-src="maestro.html">2 · 소크라테스 문답<span class="s">대화로 앱 구체화</span></button>
    <button class="tab" data-src="module5.html">3 · 바이브 코딩<span class="s">AI Studio 앱 만들기</span></button>
    <button class="tab" data-src="module3.html">4 · Notebook<span class="s">내 자료 기반 AI</span></button>
    <button class="tab" data-src="badge.html">5 · GES 배지<span class="s">배지 획득·마무리</span></button>
  </nav>
  <div class="acts">
  <a class="sv-top" href="https://forms.gle/c3F2HAdHbyHX28X28" target="_blank" rel="noopener" title="연수생 사후설문 (강사: 정진아)">📝 사후설문</a>
  <a class="ges-top" href="https://educertifications.google/google-ai-educator-series" target="_blank" rel="noopener" title="GES 공식 연수 바로가기">🎓 GES 바로가기</a>
  <a class="wow-top" href="https://jinah200.github.io/maeum/" target="_blank" rel="noopener" title="마음쉼터 — 쉬어가는 숲">🌿 마음쉼터</a>
  </div>
</header>
<div class="stage"><iframe id="frame" src="home.html?v=20261126c" title="연수 교안"></iframe></div>

<script>
(function(){
  var frame=document.getElementById('frame'); var VER='20261126c'; function U(s){ return s+'?v='+VER; }
  var tabs=[].slice.call(document.querySelectorAll('.tab'));
  var levelBtns=[].slice.call(document.querySelectorAll('#levels button'));

  // 탭 전환
  function activate(src){
    tabs.forEach(function(t){ t.classList.toggle('active',t.dataset.src===src); });
    if(frame.getAttribute('src')!==U(src)) frame.setAttribute('src',U(src));
  }
  tabs.forEach(function(t){ t.addEventListener('click',function(){ activate(t.dataset.src); }); });

  // 학교급 토글
  function curLevel(){ return localStorage.getItem('ges_level')||'elem'; }
  function setLevel(lv){
    localStorage.setItem('ges_level',lv);
    levelBtns.forEach(function(b){ b.classList.toggle('on',b.dataset.lv===lv); });
    try{ frame.contentWindow.postMessage({type:'set-level',level:lv},'*'); }catch(e){}
  }
  levelBtns.forEach(function(b){ b.addEventListener('click',function(){ setLevel(b.dataset.lv); }); });
  // 초기 토글 상태 반영
  (function(){ var lv=curLevel(); levelBtns.forEach(function(b){ b.classList.toggle('on',b.dataset.lv===lv); }); })();

  // iframe 로드되면 현재 레벨 전달
  frame.addEventListener('load',function(){
    try{ frame.contentWindow.postMessage({type:'set-level',level:curLevel()},'*'); }catch(e){}
  });

  // 자식 → 부모 메시지 (홈 카드 클릭 이동, 레벨 변경 동기화)
  window.addEventListener('message',function(ev){
    var d=ev.data||{};
    if(d.type==='goto'&&d.src){ activate(d.src); }
    if(d.type==='level-changed'){
      levelBtns.forEach(function(b){ b.classList.toggle('on',b.dataset.lv===d.level); });
    }
  });

})();
</script>
</body>
</html>
