  body{margin:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;
    font-family:"Pretendard Variable","Pretendard","Noto Sans KR",-apple-system,system-ui,sans-serif;color:var(--navy);background:#fff;}
  .topbar{flex:none;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:9px 18px;
    background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid #e8eaed;}
  .brand{font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:8px;white-space:nowrap;}
  .brand .bug{font-size:1.15rem;line-height:1;}
  .brand .bt b{color:#d93025;}
  .brand .bsub{font-size:.74rem;font-weight:600;color:var(--gray);background:#f1f3f4;border-radius:999px;padding:2px 8px;}
  @media(max-width:900px){.brand .bsub{display:none;}}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(26,115,232,.18);}
  /* 학교급 토글 */
  .levels{display:flex;gap:3px;background:#f1f3f4;border-radius:999px;padding:3px;}
  .levels button{border:0;background:transparent;font-family:inherit;font-weight:700;font-size:.85rem;

  .levels button.on{background:#fff;color:var(--blue-d);box-shadow:0 1px 3px rgba(60,64,67,.2);}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab{border:1px solid transparent;background:#fff;color:#3c4043;font-family:inherit;font-weight:600;

  .tab .s{display:block;font-size:.68rem;font-weight:600;color:var(--gray);}
  .tab:hover{border-color:var(--blue);color:var(--blue-d);}

  .tabs{order:5;flex-basis:100%;justify-content:flex-start;padding-top:2px;}
  .sv-top{background:#d93025;color:#fff;text-decoration:none;font-weight:800;font-size:.84rem;padding:7px 14px;border-radius:999px;white-space:nowrap;}
  .sv-top:hover{background:#b3261e;}
  .ges-top{background:#1a73e8;color:#fff;text-decoration:none;font-weight:700;
    font-size:.82rem;padding:7px 14px;border-radius:999px;white-space:nowrap;transition:.14s;}
  .ges-top:hover{background:#1967d2;}
  .wow-top{background:#fff;color:#7b2cbf;border:1.5px solid #7b2cbf;text-decoration:none;font-weight:700;font-size:.84rem;padding:6px 12px;border-radius:999px;white-space:nowrap;}
  .wow-top:hover{background:#f5ecfc;}
  .prog{display:flex;align-items:center;gap:7px;font-size:.82rem;font-weight:700;color:var(--gray);white-space:nowrap;}
  .prog .b{color:var(--blue-d);}
  .stage{flex:1;position:relative;background:#fff;}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  @media(max-width:720px){.tab .s{display:none;}.prog{display:none;}.brand{font-size:.9rem;}}

  <div class="levels" id="levels" title="학교급 선택">
    <button data-lv="elem" class="on">초등</button>

    <button class="tab active" data-src="home.html">🏠 홈</button>
    <button class="tab" data-src="intro.html">인트로</button>
    <button class="tab" data-src="prep.html">준비물</button>
    <button class="tab" data-src="module1.html">워밍업<span class="s">내 마음 캐릭터</span></button>
    <button class="tab" data-src="module0.html">프롬프트<span class="s">맥락·메타·리버스</span></button>

  </div>

<div class="stage"><iframe id="frame" src="home.html?v=20261113a" title="연수 교안"></iframe></div>

<script>
(function(){
  var frame=document.getElementById('frame'); var VER='20261113a'; function U(s){ return s+'?v='+VER; }
  var tabs=[].slice.call(document.querySelectorAll('.tab'));
  var levelBtns=[].slice.call(document.querySelectorAll('#levels button'));

  // 탭 전환
  function activate(src){
    tabs.forEach(function(t){ t.classList.toggle('active',t.dataset.src===src); });
    if(frame.getAttribute('src')!==U(src)) frame.setAttribute('src',U(src));
  }
  tabs.forEach(function(t){ t.addEventListener('click',function(){ activate(t.dataset.src); }); });

  // 학교급 토글
  function curLevel(){ return localStorage.getItem('ges_level')||'elem'; }
  function setLevel(lv){
    localStorage.setItem('ges_level',lv);
    levelBtns.forEach(function(b){ b.classList.toggle('on',b.dataset.lv===lv); });
    try{ frame.contentWindow.postMessage({type:'set-level',level:lv},'*'); }catch(e){}
  }
  levelBtns.forEach(function(b){ b.addEventListener('click',function(){ setLevel(b.dataset.lv); }); });
  // 초기 토글 상태 반영
  (function(){ var lv=curLevel(); levelBtns.forEach(function(b){ b.classList.toggle('on',b.dataset.lv===lv); }); })();

  // iframe 로드되면 현재 레벨 전달
  frame.addEventListener('load',function(){
    try{ frame.contentWindow.postMessage({type:'set-level',level:curLevel()},'*'); }catch(e){}
  });

  // 자식 → 부모 메시지 (홈 카드 클릭 이동, 레벨 변경 동기화)
  window.addEventListener('message',function(ev){
    var d=ev.data||{};
    if(d.type==='goto'&&d.src){ activate(d.src); }
    if(d.type==='level-changed'){
      levelBtns.forEach(function(b){ b.classList.toggle('on',b.dataset.lv===d.level); });
    }
  });

})();
</script>
</body>
